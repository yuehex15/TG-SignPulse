services:
  app:
    image: ghcr.io/yuehex15/tg-signpulse:latest
    container_name: tg-signpulse
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - PORT=8080
      - APP_DATA_DIR=/data
      - TZ=Asia/Shanghai
      # Required in production: set a strong random secret
      - APP_SECRET_KEY=${APP_SECRET_KEY:-}
      # Optional: first-boot admin password (otherwise written to data/.admin_bootstrap_password)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/__pycache__
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
