[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-signpulse"
dynamic = ["version"]
description = "Telegram multi-account automation panel: check-ins, message workflows, keyword monitoring, AI verification."
authors = [
    { name = "yuehex15" }
]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: FastAPI",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "kurigram<=2.2.7",
    "click",
    "pydantic<2",
    "openai",
    "croniter",
    "json_repair",
    "typing-extensions",
    "httpx",
    "fastapi>=0.109.2",
    "uvicorn[standard]",
    "sqlalchemy",
    "apscheduler",
    "python-jose[cryptography]",
    "python-multipart",
    "pyotp",
    "passlib[bcrypt]",
    "bcrypt<5",
    "qrcode[pil]",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.6",
    "tox>=4.32.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx",
]
speedup = [
    "tgcrypto"
]

[dependency-groups]
dev = [
    "ruff>=0.14.6",
    "tox>=4.32.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/yuehex15/TG-SignPulse"
Repository = "https://github.com/yuehex15/TG-SignPulse"
Documentation = "https://github.com/yuehex15/TG-SignPulse/tree/main/docs"

[project.scripts]
tg-signer = "tg_signer.__main__:signer"
tg-signpulse = "tg_signer.__main__:signer"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "tg_signer.__version__" }

[tool.setuptools.packages.find]
include = ["backend*", "tg_signer*"]
exclude = ["tests*", "frontend*", "docs*", "tools*", "jose*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = [
    "I", # isort
    "B", # flake8-bugbear
    "W", # pycodestyle
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "W191", # indentation contains tabs
    "B019", # Use of functools.lru_cache or functools.cache on methods can lead to memory leaks
    "B904"  # raise without from inside except
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
